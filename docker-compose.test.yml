services:
  database:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.2-apache
    ports:
      - "${KILN_MCP_TEST_PORT:-8080}:80"
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      KILN_CLEANUP_SITE_URL: "http://localhost:${KILN_MCP_TEST_PORT:-8080}"
    volumes:
      - wordpress:/var/www/html

  smoke:
    user: "0:0"
    image: wordpress:cli-2.12.0-php8.2
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      KILN_CLEANUP_SITE_URL: "http://localhost:${KILN_MCP_TEST_PORT:-8080}"
    volumes:
      - wordpress:/var/www/html
      - ./:/workspace/kiln-cleanup:ro
    working_dir: /var/www/html
    entrypoint: ["/bin/sh", "/workspace/kiln-cleanup/tests/container/smoke.sh"]

volumes:
  wordpress:
